[package]
name = "geodot-rust"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib"]

[features]
# Enables the in-engine integration-test runner (see `src/itest.rs`).
# Build with `--features itest` and load the resulting dylib from the
# `itest/` Godot project to run the tests headlessly.
itest = []

[dependencies]
gdal = { version = "0.19.0", features = ["bindgen"] }
gdal-sys = "0.12"
godot = { version = "0.5", features = ["register-docs"] }
thiserror = "2.0.18"

[dev-dependencies]
mockall = "0.15.0"
